name: Atualizar notícias de Bitcoin

on:
  schedule:
    - cron: "0 9,21 * * *"   # 06h e 18h no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar manchetes
        run: python3 scripts/atualizar_noticias.py
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain site/noticias.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/noticias.json
            git commit -m "Atualiza notícias de Bitcoin"
            git push
          fi
